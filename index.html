<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strawberry Pop Math</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF0000">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --strawberry: #FF0000;
            --lime: #32CD32;
            --ice: #AFDBF5;
            --white: #FFFFFF;
            --black: #000000;
        }

        * {
            box-sizing: border-box;
            font-family: 'Arial Black', Gadget, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--lime);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.2s ease;
            overflow: hidden;
        }

        .app-container {
            background: var(--white);
            padding: 30px;
            border: 4px solid var(--black);
            box-shadow: 8px 8px 0px var(--black);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        #problem {
            font-size: 5rem;
            margin-bottom: 20px;
            color: var(--black);
            display: inline-block;
        }

        /* Input Styling */
        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 2rem;
            border: 4px solid var(--black);
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            background: var(--white);
        }

        /* Neo-brutalism Buttons */
        button {
            width: 100%;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            border: 4px solid var(--black);
            cursor: pointer;
            background-color: var(--strawberry);
            color: var(--white);
            box-shadow: 4px 4px 0px var(--black);
            margin-bottom: 10px;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--black);
        }

        #next-btn {
            display: none;
            background-color: var(--black);
        }

        /* Animations */
        @keyframes shiver {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            100% { transform: translate(0,0) rotate(0); }
        }

        .shivering {
            animation: shiver 0.2s infinite;
            color: var(--ice) !important;
        }

        /* Brain Freeze Ice Cube */
        #ice-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            display: none;
            z-index: 100;
            pointer-events: none;
        }

        @keyframes ice-shake {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-52%, -48%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .ice-active {
            display: block !important;
            animation: ice-shake 0.3s infinite;
        }

        #feedback {
            font-size: 1.5rem;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div id="ice-overlay">🧊</div>

<div class="app-container">
    <div id="problem">-- × --</div>
    
    <input type="number" id="user-answer" placeholder="?" inputmode="numeric">

    <button id="check-btn" onclick="checkAnswer()">CHECK!</button>
    <div id="feedback"></div>
    <button id="next-btn" onclick="nextProblem()">NEXT →</button>
</div>

<script>
    let currentAnswer = 0;

    function generateProblem() {
        const isMultiplication = Math.random() > 0.5;
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        const problemEl = document.getElementById('problem');
        
        if (isMultiplication) {
            currentAnswer = num1 * num2;
            problemEl.innerText = `${num1}×${num2}`;
        } else {
            const dividend = num1 * num2;
            currentAnswer = num1; 
            problemEl.innerText = `${dividend}÷${num2}`;
        }
    }

    function strawberryBurst() {
        // Burst of Red/Pink Confetti
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#FF0000', '#FF69B4', '#FFFFFF']
        });

        // Burst of Strawberry Emojis
        const scalar = 3;
        const strawberry = confetti.shapeFromText({ text: '🍓', scalar });

        confetti({
            shapes: [strawberry],
            particleCount: 20,
            scalar,
            origin: { y: 0.6 }
        });
    }

    function brainFreeze() {
        const body = document.body;
        const ice = document.getElementById('ice-overlay');
        const problem = document.getElementById('problem');

        // Flash background
        body.style.backgroundColor = 'var(--ice)';
        ice.classList.add('ice-active');
        problem.classList.add('shivering');

        setTimeout(() => {
            body.style.backgroundColor = 'var(--lime)';
            ice.classList.remove('ice-active');
            problem.classList.remove('shivering');
        }, 1500);
    }

    function checkAnswer() {
        const input = document.getElementById('user-answer');
        const nextBtn = document.getElementById('next-btn');
        const checkBtn = document.getElementById('check-btn');
        const feedback = document.getElementById('feedback');

        if (input.value === "") return;

        if (parseInt(input.value) === currentAnswer) {
            strawberryBurst();
            feedback.innerText = "SWEET! 🍓";
            feedback.style.color = "var(--strawberry)";
        } else {
            brainFreeze();
            feedback.innerText = `BRRR! IT WAS ${currentAnswer}`;
            feedback.style.color = "var(--black)";
        }

        feedback.style.display = "block";
        checkBtn.style.display = "none";
        nextBtn.style.display = "block";
    }

    function nextProblem() {
        document.getElementById('user-answer').value = "";
        document.getElementById('feedback').style.display = "none";
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('check-btn').style.display = "block";
        generateProblem();
        document.getElementById('user-answer').focus();
    }

    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            if (document.getElementById('next-btn').style.display === 'block') nextProblem();
            else checkAnswer();
        }
    });

    generateProblem();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>
</body>
</html>
