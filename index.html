<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strawberry Pop Math</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF0000">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --strawberry: #FF0000;
            --lime: #32CD32;
            --ice: #AFDBF5;
            --white: #FFFFFF;
            --black: #000000;
        }

        * {
            box-sizing: border-box;
            font-family: 'Arial Black', Gadget, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--lime);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.2s ease;
            overflow: hidden;
        }

        .app-container {
            background: var(--white);
            padding: 30px;
            border: 4px solid var(--black);
            box-shadow: 8px 8px 0px var(--black);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        #problem {
            font-size: 5rem;
            margin-bottom: 20px;
            color: var(--black);
            display: inline-block;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 2rem;
            border: 4px solid var(--black);
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            background: var(--white);
        }

        /* Neo-brutalism Buttons */
        button {
            width: 100%;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            border: 4px solid var(--black);
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--black);
            margin-bottom: 15px; /* Spacing between buttons */
            transition: all 0.1s;
        }

        #check-btn {
            background-color: var(--strawberry);
            color: var(--white);
        }

        /* Success State for the Check Button */
        #check-btn.correct-state {
            background-color: var(--lime);
            color: var(--black);
            cursor: default;
            pointer-events: none; /* Make it unclickable once correct */
        }

        #next-btn {
            display: none; /* Hidden initially */
            background-color: var(--black);
            color: var(--white);
        }

        button:active:not(.correct-state) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--black);
        }

        /* Brain Freeze / Shiver Animations */
        @keyframes shiver {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            100% { transform: translate(0,0) rotate(0); }
        }
        .shivering { animation: shiver 0.2s infinite; color: var(--ice) !important; }

        #ice-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            display: none;
            z-index: 100;
            pointer-events: none;
        }
        .ice-active { display: block !important; }

        #feedback {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div id="ice-overlay">🧊</div>

<div class="app-container">
    <div id="problem">-- × --</div>
    
    <input type="number" id="user-answer" placeholder="?" inputmode="numeric">

    <!-- The Primary Button (Changes to 'Correct Answer') -->
    <button id="check-btn" onclick="checkAnswer()">CHECK!</button>
    
    <!-- The Secondary Button (Appears below) -->
    <button id="next-btn" onclick="nextProblem()">NEXT QUESTION →</button>

    <div id="feedback"></div>
</div>

<script>
    let currentAnswer = 0;

    function generateProblem() {
        const isMultiplication = Math.random() > 0.5;
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        const problemEl = document.getElementById('problem');
        
        if (isMultiplication) {
            currentAnswer = num1 * num2;
            problemEl.innerText = `${num1}×${num2}`;
        } else {
            const dividend = num1 * num2;
            currentAnswer = num1; 
            problemEl.innerText = `${dividend}÷${num2}`;
        }
    }

    function strawberryBurst() {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#FF0000', '#FF69B4'] });
        const strawberry = confetti.shapeFromText({ text: '🍓', scalar: 3 });
        confetti({ shapes: [strawberry], particleCount: 15, scalar: 3, origin: { y: 0.6 } });
    }

    function brainFreeze() {
        document.body.style.backgroundColor = 'var(--ice)';
        document.getElementById('ice-overlay').classList.add('ice-active');
        document.getElementById('problem').classList.add('shivering');
        setTimeout(() => {
            document.body.style.backgroundColor = 'var(--lime)';
            document.getElementById('ice-overlay').classList.remove('ice-active');
            document.getElementById('problem').classList.remove('shivering');
        }, 1200);
    }

    function checkAnswer() {
        const input = document.getElementById('user-answer');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedback = document.getElementById('feedback');

        if (input.value === "") return;

        // Hide keyboard on mobile
        input.blur();

        if (parseInt(input.value) === currentAnswer) {
            strawberryBurst();
            // Change the button text and appearance
            checkBtn.innerText = "CORRECT ANSWER!";
            checkBtn.classList.add("correct-state");
            
            // Show the next button below it
            nextBtn.style.display = "block";
        } else {
            brainFreeze();
            feedback.style.display = "block";
            feedback.innerText = `WRONG! IT WAS ${currentAnswer}`;
            
            // Even if wrong, we show the next button so they can continue
            nextBtn.style.display = "block";
        }
    }

    function nextProblem() {
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedback = document.getElementById('feedback');

        // Reset UI
        document.getElementById('user-answer').value = "";
        feedback.style.display = "none";
        
        // Reset Check Button
        checkBtn.innerText = "CHECK!";
        checkBtn.classList.remove("correct-state");
        
        // Hide Next Button
        nextBtn.style.display = "none";
        
        generateProblem();
    }

    // Keyboard "Enter" logic
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            if (document.getElementById('next-btn').style.display === 'block') {
                nextProblem();
            } else {
                checkAnswer();
            }
        }
    });

    generateProblem();
</script>
</body>
</html>
