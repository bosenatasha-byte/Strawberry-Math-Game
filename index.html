<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strawberry Pop Math</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FF0000">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --strawberry: #FF0000;
            --lime: #32CD32;
            --ice: #AFDBF5;
            --white: #FFFFFF;
            --black: #000000;
        }

        * {
            box-sizing: border-box;
            font-family: 'Arial Black', Gadget, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--lime);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.2s ease;
            overflow: hidden;
        }

        .app-container {
            background: var(--white);
            padding: 30px;
            border: 4px solid var(--black);
            box-shadow: 8px 8px 0px var(--black);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        #problem {
            font-size: 5rem;
            margin-bottom: 20px;
            color: var(--black);
            display: inline-block;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 2rem;
            border: 4px solid var(--black);
            outline: none;
            text-align: center;
            margin-bottom: 20px;
            background: var(--white);
        }

        /* Neo-brutalism Buttons */
        button {
            width: 100%;
            padding: 20px;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            border: 4px solid var(--black);
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--black);
            margin-bottom: 10px;
            transition: transform 0.1s;
        }

        #check-btn {
            background-color: var(--strawberry);
            color: var(--white);
        }

        #next-btn {
            display: none; /* Hidden until answer is checked */
            background-color: var(--black);
            color: var(--white);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--black);
        }

        /* Brain Freeze / Shiver Animations */
        @keyframes shiver {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            100% { transform: translate(0,0) rotate(0); }
        }

        .shivering {
            animation: shiver 0.2s infinite;
            color: var(--ice) !important;
        }

        #ice-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            display: none;
            z-index: 100;
            pointer-events: none;
        }

        .ice-active { display: block !important; animation: ice-shake 0.3s infinite; }
        @keyframes ice-shake {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-52%, -48%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        #feedback {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="ice-overlay">🧊</div>

<div class="app-container">
    <div id="problem">-- × --</div>
    
    <input type="number" id="user-answer" placeholder="?" inputmode="numeric">

    <!-- Check Button -->
    <button id="check-btn" onclick="checkAnswer()">CHECK!</button>
    
    <!-- Feedback Message -->
    <div id="feedback"></div>
    
    <!-- Next Button (Appears after checking) -->
    <button id="next-btn" onclick="nextProblem()">NEXT →</button>
</div>

<script>
   let currentAnswer = 0;

    function generateProblem() {
        const isMultiplication = Math.random() > 0.5;
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        const problemEl = document.getElementById('problem');
        
        if (isMultiplication) {
            currentAnswer = num1 * num2;
            problemEl.innerText = `${num1}×${num2}`;
        } else {
            const dividend = num1 * num2;
            currentAnswer = num1; 
            problemEl.innerText = `${dividend}÷${num2}`;
        }
    }

    function checkAnswer() {
        const input = document.getElementById('user-answer');
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedback = document.getElementById('feedback');

        // If user didn't type anything, do nothing
        if (input.value === "") return;

        // Show feedback section
        feedback.style.display = "block";
        
        if (parseInt(input.value) === currentAnswer) {
            strawberryBurst(); // From the confetti library
            feedback.innerText = "SWEET! 🍓";
            feedback.style.color = "var(--strawberry)";
        } else {
            brainFreeze();
            feedback.innerText = `BRRR! IT WAS ${currentAnswer}`;
            feedback.style.color = "var(--black)";
        }

        // FORCE THE BUTTON SWAP
        // We hide the red check button and show the black next button
        checkBtn.setAttribute("style", "display: none !important");
        nextBtn.setAttribute("style", "display: block !important");
        
        // Hide the keyboard on mobile so user can see the button
        input.blur(); 
    }

    function nextProblem() {
        // 1. Clear the box
        document.getElementById('user-answer').value = "";
        
        // 2. Hide feedback
        document.getElementById('feedback').style.display = "none";
        
        // 3. Swap buttons back (Show Check, Hide Next)
        document.getElementById('next-btn').setAttribute("style", "display: none !important");
        document.getElementById('check-btn').setAttribute("style", "display: block !important");
        
        // 4. New Math
        generateProblem();
    }

    // This makes the "Go" / "Enter" button on your phone keyboard work
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const nextBtn = document.getElementById('next-btn');
            if (nextBtn.style.display === 'block' || nextBtn.getAttribute('style')?.includes('block')) {
                nextProblem();
            } else {
                checkAnswer();
            }
        }
    });

    generateProblem();
</script>
</body>
</html>
